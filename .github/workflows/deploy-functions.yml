# Auto-deploy Supabase edge functions on push to main (B-013).
#
# Why: functions do NOT deploy on git push by themselves — before this
# workflow every change under supabase/functions/ needed a manual
# `npx supabase functions deploy`, and forgetting it meant the repo and
# production silently diverged (bit us repeatedly; see backlog B-013).
#
# Requires one repository secret: SUPABASE_ACCESS_TOKEN
#   (Supabase Dashboard → Account → Access Tokens → Generate new token,
#    then GitHub repo → Settings → Secrets and variables → Actions →
#    New repository secret, name it SUPABASE_ACCESS_TOKEN.)
# Until the secret exists this workflow fails with a clear error — it
# cannot break the app itself.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # No function names = deploy every function declared in
      # supabase/config.toml, so new functions are picked up
      # automatically without editing this file.
      - run: supabase functions deploy --project-ref qpzepnbqdscshylcwvhr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
